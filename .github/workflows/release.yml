name: Release

# Publishes a version: the multi-arch image (signed with cosign, with SBOM and provenance), the
# Helm chart pinned to that image digest, and install.yaml (the chart rendered with its defaults).
# A prod release also creates the GitHub Release with install.yaml and the chart attached.
#
# The GitHub environment chosen below must define:
#   AWS_ROLE_ARN               role that may push to the image (and chart) repositories
#   ECR_PUBLIC_REPOSITORY_URI  image repository, e.g. public.ecr.aws/boostrun/boostrun-cloud-controller-manager
#   CHART_REGISTRY             optional OCI registry for the chart, e.g. oci://public.ecr.aws/boostrun/charts
#                              (the chart is pushed as <registry>/boostrun-cloud-controller-manager)
# The role trusts only this repository's jobs running in that environment.
#
# A version belongs to one commit: a prod run tags it before publishing anything, and every run
# refuses a version tagged on another commit. Re-running a failed run reuses whatever it already
# published (image, chart) instead of rebuilding it under the same version.
"on":
  workflow_dispatch:
    inputs:
      tag_version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string
      environment:
        description: "GitHub environment holding the role and registries"
        required: true
        type: string
        default: prod

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

env:
  CHART_DIR: charts/boostrun-cloud-controller-manager

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow on main (got $GITHUB_REF)."
          exit 1
      - name: Validate the version
        env:
          TAG: ${{ inputs.tag_version }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "tag_version must look like v1.2.3 or v1.2.3-rc.1 (got '$TAG')."
            exit 1
          fi
      - name: Require a passing CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CI includes the chart lint and the kind install tests, which this workflow doesn't repeat.
          passed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId -q 'length')
          if [ "$passed" -eq 0 ]; then
            echo "CI has not passed on $GITHUB_SHA. Wait for it, or fix main first."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  publish:
    name: Build, sign and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check and tag the version
        id: tag
        env:
          TAG: ${{ inputs.tag_version }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          head=$(git rev-parse HEAD)
          if existing=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            if [ "$existing" != "$head" ]; then
              echo "$TAG already tags $existing, not $head. Pick a new version."
              exit 1
            fi
          elif [ "$ENVIRONMENT" = prod ]; then
            # Only prod tags, so a staging rehearsal doesn't claim the version for its commit.
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi
          echo "sha=$head" >>"$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
        with:
          registry-type: public

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A re-run after a partial failure reuses the image already published for this version:
      # rebuilding would give a new digest (SBOM and provenance differ) under the same version.
      - name: Find an image already published for this version
        id: existing
        env:
          REPOSITORY: ${{ vars.ECR_PUBLIC_REPOSITORY_URI }}
          TAG: ${{ inputs.tag_version }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          if digest=$(digest_of "$REPOSITORY:$TAG" 2>err.txt); then
            # Reuse it only if it is this commit's build (the build also pushes :<commit sha>).
            if [ "$(digest_of "$REPOSITORY:$SHA" 2>/dev/null)" != "$digest" ]; then
              echo "$REPOSITORY:$TAG ($digest) was not built from $SHA. Pick a new version."
              exit 1
            fi
            echo "$REPOSITORY:$TAG is this commit's build ($digest); reusing it."
            echo "digest=$digest" >>"$GITHUB_OUTPUT"
          elif ! grep -q ': not found$' err.txt; then
            # Anything but "not found" (auth, throttling, network) must not lead to a rebuild.
            cat err.txt
            exit 1
          fi

      - name: Build and push the image
        if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ inputs.tag_version }}
          sbom: true
          provenance: mode=max
          tags: |
            ${{ vars.ECR_PUBLIC_REPOSITORY_URI }}:${{ inputs.tag_version }}
            ${{ vars.ECR_PUBLIC_REPOSITORY_URI }}:${{ steps.tag.outputs.sha }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Always signed, also when reused: the run that pushed it may have failed before signing.
      - name: Sign the image
        env:
          IMAGE: ${{ vars.ECR_PUBLIC_REPOSITORY_URI }}@${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Log in to the chart registry
        if: vars.CHART_REGISTRY != ''
        env:
          REGISTRY: ${{ vars.CHART_REGISTRY }}
        run: |
          host=${REGISTRY#oci://}
          aws ecr-public get-login-password --region us-east-1 |
            helm registry login --username AWS --password-stdin "${host%%/*}"

      - name: Package the chart (or reuse the published one) and render install.yaml
        id: chart
        env:
          TAG: ${{ inputs.tag_version }}
          REPOSITORY: ${{ vars.ECR_PUBLIC_REPOSITORY_URI }}
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          REGISTRY: ${{ vars.CHART_REGISTRY }}
        run: |
          mkdir -p dist
          chart="$REGISTRY/boostrun-cloud-controller-manager"
          if [ -n "$REGISTRY" ] && helm pull "$chart" --version "${TAG#v}" --destination dist 2>err.txt; then
            pinned=$(tar -xOzf dist/*.tgz boostrun-cloud-controller-manager/values.yaml | sed -n 's/^  digest: "\(.*\)"$/\1/p')
            if [ "$pinned" != "$DIGEST" ]; then
              echo "Chart ${TAG#v} is already published but pins ${pinned:-no digest}, not $DIGEST. Pick a new version."
              exit 1
            fi
            echo "Chart ${TAG#v} is already published for $DIGEST; reusing it."
            echo "published=true" >>"$GITHUB_OUTPUT"
          elif [ -n "$REGISTRY" ] && ! grep -q ': not found$' err.txt; then
            cat err.txt
            exit 1
          else
            # Pin the released image: repository and digest become the chart's defaults.
            sed -i "s|^  repository: .*|  repository: ${REPOSITORY}|; s|^  digest: \"\"|  digest: \"${DIGEST}\"|" \
              "$CHART_DIR/values.yaml"
            grep -q "digest: \"${DIGEST}\"" "$CHART_DIR/values.yaml"
            helm package "$CHART_DIR" --version "${TAG#v}" --app-version "$TAG" --destination dist
          fi
          helm template boostrun-cloud-controller-manager dist/*.tgz --namespace kube-system \
            > dist/install.yaml

      - name: Push the chart
        if: vars.CHART_REGISTRY != '' && steps.chart.outputs.published != 'true'
        env:
          REGISTRY: ${{ vars.CHART_REGISTRY }}
        run: helm push dist/*.tgz "$REGISTRY"

      - name: Create the GitHub Release
        if: inputs.environment == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run: attach only what is missing; published assets are never replaced.
            have=$(gh release view "$TAG" --json assets -q '.assets[].name')
            for asset in dist/install.yaml dist/*.tgz; do
              grep -qxF "$(basename "$asset")" <<<"$have" || gh release upload "$TAG" "$asset"
            done
            exit 0
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/install.yaml dist/*.tgz --verify-tag --generate-notes \
            --title "$TAG" "${prerelease[@]}"

      - name: Summary
        env:
          TAG: ${{ inputs.tag_version }}
          IMAGE: ${{ vars.ECR_PUBLIC_REPOSITORY_URI }}
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          REGISTRY: ${{ vars.CHART_REGISTRY }}
        run: |
          {
            echo "## boostrun-cloud-controller-manager $TAG"
            echo ""
            echo "- Image: \`${IMAGE}@${DIGEST}\` (signed; verify with \`cosign verify\`)"
            if [ -n "$REGISTRY" ]; then
              echo "- Chart: \`${REGISTRY}/boostrun-cloud-controller-manager --version ${TAG#v}\`"
            else
              echo "- Chart: not pushed (CHART_REGISTRY is not set for this environment)"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
