version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - unconvert
  exclusions:
    rules:
      # Test HTTP handlers write fixed bodies; a failed write fails the test anyway.
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
