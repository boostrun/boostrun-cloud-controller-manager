{{- if .Values.apiKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bccm.fullname" . }}-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bccm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiKey.secretKey }}: {{ .Values.apiKey.value | quote }}
{{- end }}
